name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/topdown-shooter-game-Pv8Cn]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/Covert-Operations/

      - name: Push to gh-pages branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/bjoern-sellnau/Covert-Operations.git HEAD:gh-pages
